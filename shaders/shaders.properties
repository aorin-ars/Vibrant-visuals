################################################################################
#  Vibrant Visuals - pipeline configuration
################################################################################

#-------------------------------------------------------------------------------
# Shadow pass contents
#
# These five lines are what makes an entity cast a shadow shaped like itself.
# With shadowEntities off, the game falls back to the flat oval decal it draws
# under every entity, and a 20-block train car drops the same little ellipse as
# a chicken.
#-------------------------------------------------------------------------------
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
shadowTranslucent = true
shadowPlayer = true

#-------------------------------------------------------------------------------
# Vanilla effects this pack replaces
#-------------------------------------------------------------------------------
vignette = false
underwaterOverlay = false
sun = true
moon = true
oldLighting = false
oldHandLight = false
dynamicHandLight = true

#-------------------------------------------------------------------------------
# Blending
#
# shadow:        the shadow colour buffer stores a transmission tint, and
#                blending it against the clear colour would wash that out.
# clouds:        drawn into the g-buffer as a dithered cutout so they are lit,
#                fogged and reflected like any other surface.
# damagedblock:  only the colour channels are blended; the destination alpha is
#                left alone so the block keeps its material id.
#-------------------------------------------------------------------------------
blend.shadow = off
blend.gbuffers_clouds = off
blend.gbuffers_damagedblock = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE

#-------------------------------------------------------------------------------
# Options screen
#-------------------------------------------------------------------------------
screen = <profile> [SHADOWS] [ENTITIES] [LIGHTING] [ATMOSPHERE] [WATER] [WAVING] [POST]

screen.SHADOWS = shadowMapResolution shadowDistance \
                 SHADOW_FILTER SHADOW_SOFTNESS \
                 SHADOW_DISTORTION SHADOW_BIAS_SCALE \
                 SHADOW_BRIGHTNESS COLORED_SHADOWS

screen.ENTITIES = ENTITY_SHADOW_BIAS entityShadowDistanceMul \
                  HIDE_VANILLA_ENTITY_SHADOW <empty> \
                  ENTITY_SPECULAR VEHICLE_SPECULAR

screen.LIGHTING = SUN_ILLUMINANCE SKY_ILLUMINANCE \
                  BLOCKLIGHT_INTENSITY BLOCKLIGHT_TEMPERATURE \
                  MINIMUM_LIGHT ambientOcclusionLevel \
                  SPECULAR_HIGHLIGHT SUBSURFACE_SCATTERING \
                  HANDHELD_LIGHT <empty> \
                  SSAO SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH

screen.ATMOSPHERE = sunPathRotation SKY_SATURATION \
                    FOG_DENSITY FOG_ALTITUDE_FALLOFF \
                    VOLUMETRIC_LIGHT VOLUMETRIC_STEPS \
                    VOLUMETRIC_STRENGTH CLOUD_BRIGHTNESS

screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT \
               WATER_REFLECTIONS REFRACTION \
               WATER_ABSORPTION WATER_ALPHA \
               SSR SSR_STEPS SSR_REFINE

screen.WAVING = WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH

screen.POST = TONEMAP <empty> \
              AUTO_EXPOSURE EXPOSURE_SPEED \
              MANUAL_EXPOSURE WHITE_BALANCE \
              VIBRANCE SATURATION \
              CONTRAST VIGNETTE_STRENGTH \
              BLOOM BLOOM_STRENGTH \
              TAA TAA_SHARPEN \
              SHARPEN <empty>

sliders = shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS \
          SHADOW_DISTORTION SHADOW_BIAS_SCALE SHADOW_BRIGHTNESS \
          ENTITY_SHADOW_BIAS entityShadowDistanceMul \
          ENTITY_SPECULAR VEHICLE_SPECULAR \
          SUN_ILLUMINANCE SKY_ILLUMINANCE BLOCKLIGHT_INTENSITY \
          BLOCKLIGHT_TEMPERATURE MINIMUM_LIGHT ambientOcclusionLevel \
          SSAO_SAMPLES SSAO_RADIUS SSAO_STRENGTH \
          sunPathRotation SKY_SATURATION FOG_DENSITY FOG_ALTITUDE_FALLOFF \
          VOLUMETRIC_STEPS VOLUMETRIC_STRENGTH CLOUD_BRIGHTNESS \
          WATER_WAVE_HEIGHT WATER_ABSORPTION WATER_ALPHA \
          SSR_STEPS SSR_REFINE WAVING_STRENGTH \
          TONEMAP EXPOSURE_SPEED MANUAL_EXPOSURE WHITE_BALANCE \
          VIBRANCE SATURATION CONTRAST VIGNETTE_STRENGTH \
          BLOOM_STRENGTH TAA_SHARPEN SHARPEN

#-------------------------------------------------------------------------------
# Profiles
#-------------------------------------------------------------------------------
profile.POTATO = SHADOW_FILTER:0 shadowMapResolution:1024 shadowDistance:64.0 \
                 entityShadowDistanceMul:1.0 !SSAO !VOLUMETRIC_LIGHT !SSR \
                 !BLOOM !TAA !WAVING_LEAVES !WATER_REFLECTIONS !REFRACTION \
                 !COLORED_SHADOWS !SPECULAR_HIGHLIGHT

profile.LOW = SHADOW_FILTER:1 shadowMapResolution:1024 shadowDistance:96.0 \
              entityShadowDistanceMul:1.5 SSAO SSAO_SAMPLES:4 !VOLUMETRIC_LIGHT \
              !SSR BLOOM TAA WAVING_LEAVES !REFRACTION COLORED_SHADOWS \
              SPECULAR_HIGHLIGHT WATER_REFLECTIONS

profile.MEDIUM = SHADOW_FILTER:2 shadowMapResolution:2048 shadowDistance:128.0 \
                 entityShadowDistanceMul:2.0 SSAO SSAO_SAMPLES:8 \
                 VOLUMETRIC_LIGHT VOLUMETRIC_STEPS:8 SSR SSR_STEPS:12 \
                 BLOOM TAA WAVING_LEAVES REFRACTION COLORED_SHADOWS \
                 SPECULAR_HIGHLIGHT WATER_REFLECTIONS

profile.HIGH = SHADOW_FILTER:2 shadowMapResolution:2048 shadowDistance:160.0 \
               entityShadowDistanceMul:2.0 SSAO SSAO_SAMPLES:10 \
               VOLUMETRIC_LIGHT VOLUMETRIC_STEPS:12 SSR SSR_STEPS:20 \
               BLOOM TAA WAVING_LEAVES REFRACTION COLORED_SHADOWS \
               SPECULAR_HIGHLIGHT WATER_REFLECTIONS

profile.ULTRA = SHADOW_FILTER:3 shadowMapResolution:4096 shadowDistance:256.0 \
                entityShadowDistanceMul:3.0 SSAO SSAO_SAMPLES:20 \
                VOLUMETRIC_LIGHT VOLUMETRIC_STEPS:24 SSR SSR_STEPS:28 \
                SSR_REFINE:6 BLOOM TAA WAVING_LEAVES REFRACTION \
                COLORED_SHADOWS SPECULAR_HIGHLIGHT WATER_REFLECTIONS
