################################################################################
#  Vibrant Visuals - entity id mapping
#
#  The ids here must match the ENTITY_* defines in shaders/lib/consts.glsl.
################################################################################

# The flat oval the game paints under every entity.  Vibrant Visuals discards
# it, because the shadow map already draws the entity's real silhouette and
# having both puts a dark ellipse under an otherwise correct shadow.
entity.4000 = minecraft:entity_shadow

# Fire on a burning entity; shaded as an emitter rather than as painted cloth.
entity.4001 = minecraft:entity_flame

entity.4002 = minecraft:lightning_bolt

################################################################################
#  Vehicles
#
#  Entities in these two groups are shaded as lacquered bodywork - glossier,
#  more reflective, and biased for shadow casting as a large rigid body rather
#  than as a creature.  Their strength is the "Vehicle glossiness" slider.
#
#  ---------------------------------------------------------------------------
#  ADDING A TRAIN, SHIP OR AIRCRAFT MOD
#
#  Append the mod's entity ids to entity.4011 (rail) or entity.4010 (road and
#  water).  Ids are written <modid>:<entity_name>; F3 + the entity's spawn egg,
#  or the mod's own documentation, will tell you the exact name.  For example:
#
#      entity.4011 = minecraft:minecart minecraft:chest_minecart \
#                    rtm:entity_train rtm:entity_train_freight \
#                    ngtlib:entity_vehicle
#
#  Nothing breaks if a name does not exist - the loader logs it and moves on -
#  so it is safe to list entities from mods that are not currently installed.
#  A mod may also ship its own mapping at
#  assets/<modid>/shaders/entity.properties inside its jar, in which case
#  nothing needs to be added here at all.
################################################################################

entity.4010 = minecraft:boat minecraft:chest_boat

entity.4011 = minecraft:minecart minecraft:chest_minecart \
              minecraft:furnace_minecart minecraft:hopper_minecart \
              minecraft:tnt_minecart minecraft:spawner_minecart \
              minecraft:command_block_minecart
