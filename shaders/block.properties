################################################################################
#  Vibrant Visuals - block id mapping
#
#  The ids here must match the BLOCK_* defines in shaders/lib/consts.glsl.
#  Blocks not listed are shaded with the default material.
#
#  Modded blocks can be appended to any line; unknown names are logged and
#  ignored, so listing blocks from mods you do not have installed is harmless.
#  A mod may also ship its own mapping inside its jar at
#  assets/<modid>/shaders/block.properties.
################################################################################

#-------------------------------------------------------------------------------
# 10 - small plants.  Only the vertices above the sprite centre are displaced,
#      so the plant bends instead of sliding off its block.
#-------------------------------------------------------------------------------
block.10 = minecraft:grass minecraft:short_grass minecraft:fern \
           minecraft:dead_bush minecraft:dandelion minecraft:poppy \
           minecraft:blue_orchid minecraft:allium minecraft:azure_bluet \
           minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip \
           minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower \
           minecraft:lily_of_the_valley minecraft:wither_rose \
           minecraft:sweet_berry_bush minecraft:crimson_roots \
           minecraft:warped_roots minecraft:nether_sprouts \
           minecraft:sea_pickle minecraft:pink_petals

